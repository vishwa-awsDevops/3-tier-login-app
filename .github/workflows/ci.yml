cat << 'EOF' > .github/workflows/ci.yml
name: Production CI/CD Pipeline (OIDC + GitOps)

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Log in to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Images to AWS ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/mern-backend:$IMAGE_TAG ./backend
          docker push $ECR_REGISTRY/mern-backend:$IMAGE_TAG
          
          docker build --build-arg VITE_API_URL=http://backend-service:5000 -t $ECR_REGISTRY/mern-frontend:$IMAGE_TAG ./frontend
          docker push $ECR_REGISTRY/mern-frontend:$IMAGE_TAG

      - name: Update Kubernetes Manifests (GitOps Trigger)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git clone https://${{ secrets.MANIFEST_REPO_PAT }}@github.com/vishwa-awsDevops/3-tier-k8s-manifests.git manifest-repo
          cd manifest-repo/k8s
          
          sed -i "s|$ECR_REGISTRY/mern-backend:.*|$ECR_REGISTRY/mern-backend:$IMAGE_TAG|g" backend.yaml
          sed -i "s|$ECR_REGISTRY/mern-frontend:.*|$ECR_REGISTRY/mern-frontend:$IMAGE_TAG|g" frontend.yaml
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "ci(release): update image tags to commit $IMAGE_TAG"
          git push
EOF